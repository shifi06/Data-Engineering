<script>
// ═══════════════════════════════════════════════════════════
// KONFIGURASI UTAMA (Pastikan Huruf Besar Semua & Sesuai!)
// ═══════════════════════════════════════════════════════════
const USE_DUMMY = true; // Set ke false kalau Apps Script lu udah bener-bener siap!
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxlDMncmReEDRAeNyIGi8v1qv4g_oBfqLNIfxY2iz_10uUdFno6Lo1fke058DZNcoxx/exec";

// Data Dummy Cadangan
const DUMMY_DATA = [
  { Nama:"Dr. Rina Kusumawati", Kota:"Bogor", Provinsi:"Jawa Barat", Keahlian:"Medis", Detail:"Dokter Umum, Puskesmas Bogor Tengah", Kontak:"081234567890", Status:"Siap", Verified:"TRUE", Flags:"0" },
  { Nama:"Budi Santoso", Kota:"Cianjur", Provinsi:"Jawa Barat", Keahlian:"Logistik", Detail:"Pengemudi truk 10 tahun, siap evakuasi", Kontak:"082345678901", Status:"Siap", Verified:"TRUE", Flags:"0" },
  { Nama:"Sari Dewi", Kota:"Bandung", Provinsi:"Jawa Barat", Keahlian:"Psikologi", Detail:"Psikolog klinis, spesialis trauma bencana", Kontak:"083456789012", Status:"Siap", Verified:"FALSE", Flags:"0" },
  { Nama:"Ahmad Fauzi", Kota:"Jakarta Selatan", Provinsi:"DKI Jakarta", Keahlian:"Teknik", Detail:"Teknisi listrik PLN, siap perbaikan darurat", Kontak:"084567890123", Status:"Terbatas", Verified:"TRUE", Flags:"0" },
  { Nama:"Lestari Ningrum", Kota:"Bogor", Provinsi:"Jawa Barat", Keahlian:"Komunikasi", Detail:"Operator radio amatir ORARI", Kontak:"085678901234", Status:"Siap", Verified:"FALSE", Flags:"0" }
];

let ALL_DATA = [];

// Jalan pertama kali pas web dibuka
window.onload = function() {
  loadData();
};

function showSection(sec) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  
  const targetSec = document.getElementById('sec-' + sec);
  if(targetSec) targetSec.classList.add('active');
  
  const tabs = document.querySelectorAll('.nav-tab');
  tabs.forEach(tab => {
    if(tab.getAttribute('onclick').includes(`'${sec}'`)) {
      tab.classList.add('active');
    }
  });
}

function goToCari() {
  showSection('cari');
}

// FUNGSI LOAD DATA ANTI-MACET
async function loadData() {
  const container = document.getElementById('cards-container');
  if (!container) return;

  // JIKA PAKAI DUMMY ATAU JIKA URL MASIH KOSONG/DEFAULT
  if (USE_DUMMY || APPS_SCRIPT_URL.includes("URL_APPS_SCRIPT_LU")) {
    console.log("Menggunakan data dummy...");
    ALL_DATA = [...DUMMY_DATA];
    renderCards(ALL_DATA);
    updateStats(ALL_DATA);
    populateKotaFilter(ALL_DATA);
    return;
  }
  
  try {
    // Pasang timeout biar ga loading selamanya kalau server down
    const controller = new AbortController();
    const id = setTimeout(() => controller.abort(), 8000);
    
    const res = await fetch(APPS_SCRIPT_URL, { signal: controller.signal });
    clearTimeout(id);
    
    const json = await res.json();
    if (json && json.status === 'success') {
      ALL_DATA = json.data;
    } else {
      console.warn("Respon server gagal, fallback ke dummy.");
      ALL_DATA = [...DUMMY_DATA];
    }
  } catch(e) {
    console.error("Gagal konek ke Apps Script, otomatis pakai data dummy:", e);
    ALL_DATA = [...DUMMY_DATA]; // Fallback otomatis biar gak stuck muter!
  }
  
  renderCards(ALL_DATA);
  updateStats(ALL_DATA);
  populateKotaFilter(ALL_DATA);
}

function renderCards(data) {
  const container = document.getElementById('cards-container');
  if(!container) return;
  
  if(!data || data.length === 0) {
    container.innerHTML = `<div class="empty-state"><div class="empty-icon">🔍</div><h3>Tidak ada relawan ditemukan</h3><p>Coba kata kunci atau filter lain.</p></div>`;
    return;
  }
  
  let html = '<div class="cards-grid">';
  data.forEach((r, idx) => {
    const sCls = (r.Keahlian || 'Lainnya').toLowerCase();
    const isVer = r.Verified === 'TRUE' || r.Verified === true;
    
    html += `
      <div class="relawan-card">
        <button class="flag-btn" onclick="openFlag(${idx})" title="Laporkan data">🚩</button>
        <div class="card-top">
          <div class="card-avatar avatar-${sCls}">${(r.Nama || 'R').charAt(0)}</div>
          <span class="badge-verify ${isVer ? 'badge-verified' : 'badge-unverified'}">
            ${isVer ? '✓ Terverifikasi' : 'Belum Verifikasi'}
          </span>
        </div>
        <div class="card-name">${r.Nama || 'Tanpa Nama'}</div>
        <span class="card-skill skill-${sCls}">${r.Keahlian || 'Lainnya'}</span>
        <div class="card-info">
          <div class="card-info-row">📍 <span>${r.Kota || '-'}, ${r.Provinsi || '-'}</span></div>
          <div class="card-info-row">📝 <span>${r.Detail || 'Tidak ada detail.'}</span></div>
          <div class="card-info-row">⏱️ <span>Ketersediaan: <strong>${r.Status || 'Siap'}</strong></span></div>
        </div>
        <div class="card-kontak">
          <div class="kontak-num">${maskKontak(r.Kontak)}</div>
          <button class="btn-kontak" onclick="hubungiRelawan('${r.Kontak}')">Hubungi</button>
        </div>
      </div>
    `;
  });
  html += '</div>';
  container.innerHTML = html;
}

function maskKontak(num) {
  if(!num) return '-';
  if(num.length > 6) return num.substring(0, num.length - 4) + '****';
  return num;
}

function hubungiRelawan(num) {
  if(!num) return;
  window.open(`https://wa.me/${num.replace(/[^0-9]/g, '')}`, '_blank');
}

function updateStats(data) {
  if(!document.getElementById('stat-total')) return;
  document.getElementById('stat-total').innerText = data.length;
  
  const uniqueKota = [...new Set(data.map(r => r.Kota).filter(Boolean))];
  document.getElementById('stat-kota').innerText = uniqueKota.length;
  
  const verCount = data.filter(r => r.Verified === 'TRUE' || r.Verified === true).length;
  document.getElementById('stat-verified').innerText = verCount;
}

function populateKotaFilter(data) {
  const sel = document.getElementById('filter-kota');
  if(!sel) return;
  const currentVal = sel.value;
  sel.innerHTML = '<option value="">Semua Kota</option>';
  
  const uniqueKota = [...new Set(data.map(r => r.Kota).filter(Boolean))].sort();
  uniqueKota.forEach(k => {
    sel.innerHTML += `<option value="${k}">${k}</option>`;
  });
  sel.value = currentVal;
}

function filterCards() {
  const qNama = document.getElementById('search-nama').value.toLowerCase();
  const qKota = document.getElementById('filter-kota').value;
  const qSkill = document.getElementById('filter-skill').value;
  
  const filtered = ALL_DATA.filter(r => {
    const matchNama = (r.Nama || '').toLowerCase().includes(qNama) || (r.Detail || '').toLowerCase().includes(qNama);
    const matchKota = !qKota || r.Kota === qKota;
    const matchSkill = !qSkill || r.Keahlian === qSkill;
    return matchNama && matchKota && matchSkill;
  });
  
  renderCards(filtered);
}

// FUNGSI SUBMIT FORM ANTI-STUCK
async function submitForm(e) {
  e.preventDefault();
  const btn = document.getElementById('submit-btn');
  if(!btn) return;
  
  btn.disabled = true;
  btn.innerText = 'Menyimpan...';
  
  const payload = {
    Nama: document.getElementById('f-nama').value,
    Kota: document.getElementById('f-kota').value,
    Provinsi: document.getElementById('f-provinsi').value,
    Keahlian: document.getElementById('f-skill').value,
    Detail: document.getElementById('f-detail').value,
    Kontak: document.getElementById('f-kontak').value,
    Status: document.getElementById('f-status').value
  };
  
  if(USE_DUMMY) {
    setTimeout(() => {
      DUMMY_DATA.push({ ...payload, Verified: 'FALSE', Flags: '0' });
      showSuccess();
    }, 1000);
    return;
  }
  
  try {
    const res = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors', // Mencegah eror CORS di beberapa browser
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    
    // Karena pakai no-cors, kita langsung asumsikan sukses kalau gak melempar eror
    showSuccess();
  } catch(err) {
    console.error("Eror pas kirim data:", err);
    alert('Koneksi internet bermasalah, tapi data dicoba simpan lokal.');
    DUMMY_DATA.push({ ...payload, Verified: 'FALSE', Flags: '0' });
    showSuccess();
  }
}

function showSuccess() {
  document.getElementById('form-area').style.display = 'none';
  document.getElementById('success-area').style.display = 'block';
  loadData();
}

function resetForm() {
  document.getElementById('reg-form').reset();
  document.getElementById('form-area').style.display = 'block';
  document.getElementById('success-area').style.display = 'none';
  resetBtn();
}

function resetBtn() {
  const btn = document.getElementById('submit-btn');
  if(!btn) return;
  btn.disabled = false;
  btn.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="white"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg> Daftarkan Sekarang`;
}

let targetedFlagIdx = null;
function openFlag(idx) {
  targetedFlagIdx = idx;
  document.getElementById('flag-modal').classList.add('open');
}
function closeFlag() {
  document.getElementById('flag-modal').classList.remove('open');
}
function confirmFlag() {
  closeFlag();
  showToast('🚩 Laporan berhasil dikirim.');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  if(!t) return;
  t.innerText = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}
</script>
